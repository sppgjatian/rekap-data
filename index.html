<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Database Rekap File</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        .tab-active { color: #2563eb; border-bottom: 3px solid #2563eb; font-weight: 600;}
        .tab-inactive { color: #6b7280; border-bottom: 3px solid transparent; }
        .badge-valid { background-color: #dcfce7; color: #166534; padding: 4px 10px; border-radius: 9999px; font-weight: 600; font-size: 0.8rem;}
        .badge-invalid { background-color: #fee2e2; color: #991b1b; padding: 4px 10px; border-radius: 9999px; font-weight: 600; font-size: 0.8rem;}
        .btn-link { background-color: #eff6ff; color: #2563eb; padding: 4px 10px; border-radius: 6px; font-weight: 500; font-size: 0.8rem; text-decoration: none; border: 1px solid #bfdbfe;}
        .btn-link:hover { background-color: #dbeafe; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen p-4 md:p-8 font-sans">
    <div class="max-w-6xl mx-auto bg-white shadow-xl rounded-xl p-6 md:p-8">
        <h1 class="text-2xl md:text-3xl font-bold text-center text-gray-800 mb-2">Database Status Pengumpulan File</h1>
        <p class="text-center text-gray-500 mb-6 text-sm">Pantau status validasi template file yang telah diunggah</p>
        
        <!-- Tabs -->
        <div class="flex space-x-6 mb-6 border-b border-gray-200">
            <button id="tab-siswa" class="tab-btn tab-active px-4 py-2 transition">Siswa</button>
            <button id="tab-guru" class="tab-btn tab-inactive px-4 py-2 transition">Guru / Pendukung</button>
        </div>

        <!-- Search -->
        <div class="mb-6 relative">
            <input type="text" id="searchInput" class="w-full p-3 border border-gray-300 rounded-lg pl-10 focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="Cari nama sekolah...">
            <svg class="w-5 h-5 absolute left-3 top-3.5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
        </div>

        <!-- Table -->
        <div class="overflow-x-auto rounded-lg border border-gray-200 shadow-sm">
            <table class="min-w-full bg-white">
                <thead id="tableHead" class="bg-gray-50 border-b border-gray-200"></thead>
                <tbody id="tableBody" class="divide-y divide-gray-200"></tbody>
            </table>
        </div>
        <p id="statusText" class="text-center text-gray-500 mt-4 text-sm">Memuat data...</p>
    </div>

    <script>
        // === PASTE LINK CSV DARI TAHAP 1 DI SINI ===
        const URL_SISWA = "PASTE_LINK_CSV_SISWA"; 
        const URL_GURU = "PASTE_LINK_CSV_GURU";

        let currentData = [];
        let currentTab = 'siswa';

        document.getElementById('tab-siswa').addEventListener('click', () => switchTab('siswa'));
        document.getElementById('tab-guru').addEventListener('click', () => switchTab('guru'));

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase();
            renderTable(currentData.filter(row => Object.values(row).some(val => String(val).toLowerCase().includes(searchTerm))));
        });

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(btn => { btn.classList.remove('tab-active'); btn.classList.add('tab-inactive'); });
            document.getElementById('tab-' + tab).classList.add('tab-active');
            document.getElementById('tab-' + tab).classList.remove('tab-inactive');
            loadData(tab === 'siswa' ? URL_SISWA : URL_GURU);
        }

        async function loadData(url) {
            document.getElementById('tableBody').innerHTML = ''; 
            document.getElementById('tableHead').innerHTML = '';
            document.getElementById('statusText').innerText = 'Memuat...'; 
            
            if(url.includes("PASTE_LINK")) { 
                document.getElementById('statusText').innerText = '⚠️ Ganti URL CSV di dalam kode HTML!'; 
                return; 
            }

            try {
                const parsed = Papa.parse(await (await fetch(url)).text(), { header: true, skipEmptyLines: true });
                currentData = parsed.data;
                renderTable(currentData);
            } catch (error) { 
                document.getElementById('statusText').innerText = '❌ Gagal memuat.'; 
            }
        }

        function renderTable(data) {
            const thead = document.getElementById('tableHead'); 
            const tbody = document.getElementById('tableBody');
            thead.innerHTML = ''; tbody.innerHTML = '';
            
            if (data.length === 0) { 
                document.getElementById('statusText').innerText = 'Data kosong.'; 
                return; 
            }
            document.getElementById('statusText').style.display = 'none';
            
            // Kolom yang ingin disembunyikan demi privasi dan kerapian
            const hiddenColumns = ['timestamp', 'email', 'telepon', 'tipe identitas', 'kode identitas'];
            const headers = Object.keys(data[0]).filter(h => !hiddenColumns.includes(h.toLowerCase()));

            let headRow = document.createElement('tr');
            headers.forEach(header => { 
                let th = document.createElement('th'); 
                th.className = "py-3 px-4 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider"; 
                th.innerText = header.replace('unggah file data "pendukung"', 'Link File').replace('unggah file', 'Link File'); 
                headRow.appendChild(th); 
            });
            thead.appendChild(headRow);

            data.forEach(row => {
                let tr = document.createElement('tr');
                tr.className = "hover:bg-gray-50 transition";
                headers.forEach(header => { 
                    let td = document.createElement('td'); 
                    td.className = "py-3 px-4 text-sm text-gray-700 whitespace-nowrap"; 
                    let val = row[header] || '-';
                    
                    // Logika Link File
                    if (header.toLowerCase().includes('unggah') || header.toLowerCase().includes('file')) {
                        if (val.startsWith('http')) {
                            td.innerHTML = `<a href="${val}" target="_blank" class="btn-link">📂 Buka File</a>`;
                        } else {
                            td.innerText = val;
                        }
                    } 
                    // Logika Status Validasi
                    else if (header.toLowerCase().includes('status')) {
                        if (val.includes('VALID') && !val.includes('TIDAK')) {
                            td.innerHTML = `<span class="badge-valid">✅ ${val}</span>`;
                        } else {
                            td.innerHTML = `<span class="badge-invalid">❌ ${val}</span>`;
                        }
                    } 
                    else {
                        td.innerText = val;
                    }
                    tr.appendChild(td); 
                });
                tbody.appendChild(tr);
            });
        }
        switchTab('siswa');
    </script>
</body>
</html>
